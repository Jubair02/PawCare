<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" role="img" aria-label="PawCare — Pet Care Platform">
  <title>PawCare</title>
  <defs>
    <linearGradient id="pawcareLockup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>

  <!-- Mark: same paw geometry as favicon.svg, on the app's emerald→teal gradient -->
  <rect width="64" height="64" rx="16" fill="url(#pawcareLockup)"/>
  <g fill="#ffffff">
    <ellipse cx="22" cy="24" rx="5.5" ry="7" transform="rotate(-18 22 24)"/>
    <ellipse cx="42" cy="24" rx="5.5" ry="7" transform="rotate(18 42 24)"/>
    <ellipse cx="13" cy="36" rx="4.5" ry="6" transform="rotate(-38 13 36)"/>
    <ellipse cx="51" cy="36" rx="4.5" ry="6" transform="rotate(38 51 36)"/>
    <path d="M32 32c7 0 12.5 5.4 12.5 11.2 0 4.3-3.2 6.8-6.6 6.8-2.3 0-4-1-5.9-1s-3.6 1-5.9 1c-3.4 0-6.6-2.5-6.6-6.8C19.5 37.4 25 32 32 32z"/>
  </g>

  <!-- Wordmark: matches the in-app BrandMark (bold, tracking-tight) -->
  <text x="80" y="36" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="26" font-weight="700" letter-spacing="-0.7" fill="#0f291f">PawCare</text>
  <text x="81" y="52" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="11" font-weight="500" letter-spacing="0.2" fill="#5c7a6e">Pet Care Platform</text>
</svg>
