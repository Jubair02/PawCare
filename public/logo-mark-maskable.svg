<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PawCare">
  <title>PawCare</title>
  <defs>
    <linearGradient id="pawcareMaskable" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed: the platform applies its own mask, so no rounded corners here.
       The paw is scaled to sit inside the 80% safe zone. -->
  <rect width="64" height="64" fill="url(#pawcareMaskable)"/>
  <g fill="#ffffff" transform="translate(32 32) scale(0.72) translate(-32 -32)">
    <ellipse cx="22" cy="24" rx="5.5" ry="7" transform="rotate(-18 22 24)"/>
    <ellipse cx="42" cy="24" rx="5.5" ry="7" transform="rotate(18 42 24)"/>
    <ellipse cx="13" cy="36" rx="4.5" ry="6" transform="rotate(-38 13 36)"/>
    <ellipse cx="51" cy="36" rx="4.5" ry="6" transform="rotate(38 51 36)"/>
    <path d="M32 32c7 0 12.5 5.4 12.5 11.2 0 4.3-3.2 6.8-6.6 6.8-2.3 0-4-1-5.9-1s-3.6 1-5.9 1c-3.4 0-6.6-2.5-6.6-6.8C19.5 37.4 25 32 32 32z"/>
  </g>
</svg>
